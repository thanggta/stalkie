name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Metal availability
        # The GPU determinism tests skip when no Metal device exists. This
        # probe makes that explicit rather than silent: a NONE here means the
        # renderer tests were skipped, and the report must say so.
        run: |
          cat > /tmp/metalcheck.swift <<'EOF'
          import Metal
          if let device = MTLCreateSystemDefaultDevice() {
            print("METAL_DEVICE=\(device.name)")
          } else {
            print("METAL_DEVICE=NONE")
          }
          EOF
          swift /tmp/metalcheck.swift
      - name: Build package
        run: swift build
      - name: Test
        run: swift test
      - name: Validate every case via CLI
        run: |
          set -e
          for d in cases/*/; do
            echo "== $d"
            swift run CarveCLI "$d" >/dev/null || exit 1
          done
      - name: Validate catalog
        run: swift run CarveCLI --catalog cases/catalog.json
      - name: Release bypass cannot grant entitlement
        run: swift test -c release --filter EntitlementBypassReleaseTests
      - name: Build phone shell UI (SPM)
        # Compiles SwiftUI shell + viewers on the host. Proves the theme layer
        # and fragment wiring typecheck without a simulator.
        run: swift build --target CarveUI
      - name: Build iOS app (simulator)
        # generic/platform avoids depending on a named simulator device.
        # CODE_SIGNING_ALLOWED=NO so CI never needs a signing identity.
        run: |
          xcodebuild \
            -project Apps/Carve.xcodeproj \
            -scheme Carve \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            build
      - name: Build UI test target (compile only)
        # Kept until the executing job below is proven green in CI.
        # FullLoopUITests is also executed by the `uitest` job.
        run: |
          xcodebuild \
            -project Apps/Carve.xcodeproj \
            -scheme Carve \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            build-for-testing

  uitest:
    name: Execute UI tests
    # macos-26 ships Xcode 26.x and iOS 26.0–26.2 runtimes. Prefer those over
    # 26.5: StoreKitTest under xcodebuild fails with Code=3 on 26.5 simulators
    # (Octane config never syncs). The selection script ranks 26.0–26.2 first.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          # Prefer an Xcode whose bundled simulator runtimes still sync StoreKit.
          for candidate in \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.1.app \
            /Applications/Xcode_26.0.1.app \
            /Applications/Xcode_26.0.app \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode.app
          do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              break
            fi
          done
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true
      - name: Execute UI tests
        run: |
          chmod +x scripts/ci-run-ui-tests.sh
          scripts/ci-run-ui-tests.sh
      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UITest-xcresult
          path: |
            TestResults/FullLoop.xcresult
            TestResults/StoreKit.xcresult
            TestResults/xcodebuild.log
          if-no-files-found: warn
